enable-magisk-update = true # set this to false if you do not want to receive updates for the module in magisk app
parallel-jobs = 1
dpi = "nodpi anydpi 120-640dpi"

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/j-hc/revanced-magisk-module/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

[YouTube-Morphe]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[GooglePhotos]
enabled = true
rv-brand = "Morphe"
cli-source = "MorpheApp/morphe-cli"
patches-source = "RookieEnough/De-ReVanced"
cli-version = "latest"
patches-version = "latest"
build-mode = "apk"
arch = "arm64-v8a"
version = "latest"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
uptodown-dlurl = "https://google-photos.en.uptodown.com/android"
#archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos"

[Music-Morphe]
enabled = true
app-name = "YT Music"
patches-source = "MorpheApp/morphe-patches"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
patcher-args = "-e 'Clone app' -OpackageName=com.google.android.apps.youtube.music"

[Reddit-Morphe]
enabled = true
app-name = "Reddit"
rv-brand = "Morphe"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
patches-version = "latest"
build-mode = "apk"
arch = "all"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.reddit.frontpage"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit/"

[Instagram-Morphe]
enabled = true
rv-brand = "Morphe"
patches-source = "crimera/piko"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
patches-version = "dev"
build-mode = "apk"
arch = "arm64-v8a"
archive-dlurl = "https://archive.org/download/sutyiapks/com.instagram.android/"
apkmirror-dlurl = "https://apkmirror.com/apk/instagram/instagram-instagram/"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"

[CamScanner-Morphe]
enabled = true
rv-brand = "Morphe"
patches-source = "hoo-dles/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
patches-version = "latest"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/intsig-pte/camscanner-phone-pdf-creator/"
uptodown-dlurl = "https://camscanner-pdf-creator.en.uptodown.com/android"

[Messenger]
enabled = false
rv-brand = "Morphe"
cli-source = "MorpheApp/morphe-cli"
patches-source = "RookieEnough/De-ReVanced"
cli-version = "latest"
patches-version = "latest"
build-mode = "apk"
arch = "arm64-v8a"
version = "552.0.0.44.65"
excluded-patches = "'Disable typing indicator'"
apkmirror-dlurl = "https://apkmirror.com/apk/facebook-2/messenger/"
uptodown-dlurl = "https://facebook-messenger.en.uptodown.com/android"

[YouTube-Extended]
enabled = false
app-name = "RVX"
patches-source = "anddea/revanced-patches"
patches-version = "dev"
cli-source = "MorpheApp/morphe-cli"
build-mode = "apk"
arch = "arm64-v8a"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube/"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"

